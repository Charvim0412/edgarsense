<svg width="700" height="640" viewBox="0 0 700 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="700" height="640" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="260" y="20" width="200" height="56" rx="8" fill="#EFEFEF" stroke="#999999" stroke-width="0.5"/>
<text x="360" y="43" text-anchor="middle" font-size="14" font-weight="600" fill="#222222">route</text>
<text x="360" y="60" text-anchor="middle" font-size="11" fill="#555555">detect ticker(s), pick strategy</text>
<line x1="360" y1="76" x2="360" y2="118" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="260" y="118" width="200" height="56" rx="8" fill="#DCEEFB" stroke="#5FA8D3" stroke-width="0.5"/>
<text x="360" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#1A4E6B">retrieve</text>
<text x="360" y="158" text-anchor="middle" font-size="11" fill="#1A4E6B">hybrid search: pgvector + BM25 (RRF)</text>
<line x1="360" y1="174" x2="360" y2="216" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="260" y="216" width="200" height="56" rx="8" fill="#E8DFF5" stroke="#9B7EDE" stroke-width="0.5"/>
<text x="360" y="239" text-anchor="middle" font-size="14" font-weight="600" fill="#3D2A66">synthesize</text>
<text x="360" y="256" text-anchor="middle" font-size="11" fill="#3D2A66">LLM drafts cited answer</text>
<line x1="360" y1="272" x2="360" y2="314" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="260" y="314" width="200" height="60" rx="8" fill="#FBE3DC" stroke="#D8734F" stroke-width="1"/>
<text x="360" y="336" text-anchor="middle" font-size="14" font-weight="600" fill="#7A2E14">critic</text>
<text x="360" y="353" text-anchor="middle" font-size="11" fill="#7A2E14">checks numeric claims vs excerpts</text>

<path d="M460 340 L560 340 L560 146 L462 146" fill="none" stroke="#D8734F" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text x="565" y="240" font-size="10" fill="#7A2E14">unsupported claim:</text>
<text x="565" y="253" font-size="10" fill="#7A2E14">retry (max 2), retrieve again</text>

<line x1="300" y1="374" x2="300" y2="416" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="140" y="416" width="180" height="56" rx="8" fill="#EFEFEF" stroke="#999999" stroke-width="0.5"/>
<text x="230" y="439" text-anchor="middle" font-size="13" font-weight="600" fill="#222222">verified answer</text>
<text x="230" y="456" text-anchor="middle" font-size="10" fill="#555555">answer + citations</text>

<line x1="420" y1="374" x2="420" y2="416" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="330" y="416" width="220" height="56" rx="8" fill="#EFEFEF" stroke="#999999" stroke-width="0.5"/>
<text x="440" y="439" text-anchor="middle" font-size="13" font-weight="600" fill="#222222">max retries reached</text>
<text x="440" y="456" text-anchor="middle" font-size="10" fill="#555555">answer returned, flagged unverified</text>

<rect x="40" y="530" width="10" height="10" fill="#D8734F"/>
<text x="58" y="539" font-size="11" fill="#333333">dashed line = critic-triggered re-retrieval loop</text>

<text x="360" y="600" text-anchor="middle" font-size="12" fill="#888888">EdgarSense - multi-agent retrieval pipeline (LangGraph)</text>
</svg>
